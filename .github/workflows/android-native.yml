name: Android app (native, Capacitor)

# The real Android app: the app's code is packaged INSIDE the APK (no Chrome,
# no address bar), with Android share-to-app, app shortcuts, native Google
# sign-in and a branded splash. Produces a signed APK (install / Indus) and AAB
# (Google Play). Same package name and upload key as before, so it installs as
# an update over the earlier app.
#
# Secrets used:
#   ANDROID_KEY_SEED (or CRON_SECRET) — re-creates the upload key (never stored)
#   GOOGLE_SERVICES_JSON (optional)   — Firebase → Project settings → Android app
#                                       → google-services.json (whole file). Without
#                                       it, Google sign-in shows "not set up yet".

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 2.0.1). Leave empty for 2.0.<run>"
        required: false
        default: ""
      diagnose:
        description: "Test build: run it on an Android emulator and report what happens inside (not for release)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/android-native/**"
      - "src/native/**"
      - "capacitor.config.json"
      - "vite.native.config.js"
      - ".github/workflows/android-native.yml"

permissions:
  contents: read

concurrency:
  group: android-native
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app + Capacitor packages
        run: |
          npm install --no-audit --no-fund --loglevel=error > "$RUNNER_TEMP/npm.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/npm.log"; exit 1; }
          # Added to package.json on the build machine only (not committed):
          # Capacitor puts an Android plugin into the app ONLY if it is listed
          # in package.json — with --no-save every plugin was silently left out.
          npm install --save --no-audit --no-fund --loglevel=error \
            @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 \
            @capacitor/app@7 @capacitor/share@7 @capacitor/browser@7 \
            @capacitor/splash-screen@7 @capacitor/status-bar@7 \
            @capacitor/filesystem@7 @capacitor-community/text-to-speech@6 \
            @capacitor-community/speech-recognition@7 \
            @capacitor-firebase/authentication@7 sharp@0.33.5 >> "$RUNNER_TEMP/npm.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/npm.log"; exit 1; }
          cd scripts/android && npm install --no-save --no-package-lock --loglevel=error node-forge@1.3.1 >> "$RUNNER_TEMP/npm.log" 2>&1
          cd "$GITHUB_WORKSPACE" && npx cap --version

      - name: Google sign-in config (optional secret)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > "$RUNNER_TEMP/google-services.json"
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$RUNNER_TEMP/google-services.json" \
              || { echo "::error title=GOOGLE_SERVICES_JSON::secret is not valid JSON"; exit 1; }
            echo "YS_NATIVE_FIREBASE=1" >> "$GITHUB_ENV"
            echo "::notice title=Google sign-in::on (google-services.json found)"
          else
            echo "YS_NATIVE_FIREBASE=0" >> "$GITHUB_ENV"
            echo "::warning title=Google sign-in::off — add the GOOGLE_SERVICES_JSON secret to turn it on"
          fi

      - name: Test build switch
        run: |
          if [ "${{ github.event.inputs.diagnose }}" = "true" ]; then
            echo "YS_DIAG=1" >> "$GITHUB_ENV"
            node -e 'const f="capacitor.config.json",fs=require("fs"),c=JSON.parse(fs.readFileSync(f));c.android.webContentsDebuggingEnabled=true;c.loggingBehavior="production";fs.writeFileSync(f,JSON.stringify(c,null,2))'
            echo "::warning title=Test build::diagnose build (debuggable app screen) — do not publish this APK"
          else
            echo "YS_DIAG=0" >> "$GITHUB_ENV"
          fi

      - name: Build the app files (inside the APK)
        run: |
          VITE_YS_DIAG=$YS_DIAG npx vite build -c vite.native.config.js 2>&1 | tee "$RUNNER_TEMP/vite.log"
          test -f dist-native/index.html
          # the Android bridge (src/native/bridge.js) must be inside the app's code
          grep -rlq "__ysShared" dist-native/assets/ || { echo "::error title=Android bridge missing::src/native/bridge.js is not in the build (entry not switched to main-native.jsx)"; exit 1; }
          grep -q "main-native\|/assets/" dist-native/index.html
          du -sh dist-native

      - name: Create Android project
        run: |
          npx cap add android 2>&1 | tee "$RUNNER_TEMP/cap.log"
          # every Android plugin the app relies on must be wired into the project
          for p in capacitor-app capacitor-share capacitor-browser capacitor-splash-screen capacitor-status-bar \
                   capacitor-filesystem capacitor-community-text-to-speech capacitor-community-speech-recognition \
                   capacitor-firebase-authentication; do
            grep -q "':$p'" android/capacitor.settings.gradle || { echo "::error title=Plugin missing::$p is not in the Android project"; cat android/capacitor.settings.gradle; exit 1; }
          done
          echo "::notice title=Plugins::$(grep -c "^include ':capacitor-" android/capacitor.settings.gradle) Android plugins wired in"
          if [ "$YS_NATIVE_FIREBASE" = "1" ]; then cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json; fi

      - name: App icons
        run: |
          node scripts/android-native/icons.mjs android/app/src/main/res

      - name: Customise (share, shortcuts, splash, version, signing)
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="2.0.${{ github.run_number }}"; fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          npx cap sync android 2>&1 | tail -n 15
          node scripts/android-native/patch.mjs "$VERSION_CODE" "$VERSION_NAME" "$YS_NATIVE_FIREBASE"

      - name: Re-create the upload key (never stored)
        id: key
        env:
          SEED: ${{ secrets.ANDROID_KEY_SEED || secrets.CRON_SECRET }}
        run: |
          mkdir -p "$RUNNER_TEMP/key"
          node scripts/android/make-upload-key.mjs "$RUNNER_TEMP/key"
          echo "YS_KEYSTORE=$RUNNER_TEMP/key/upload.p12" >> "$GITHUB_ENV"

      - name: Build and sign (APK + AAB)
        working-directory: android
        run: |
          export YS_STORE_PASS="$BUBBLEWRAP_KEYSTORE_PASSWORD"
          chmod +x gradlew
          ./gradlew --no-daemon -q assembleRelease bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          code=${PIPESTATUS[0]}; [ $code = 0 ] || exit $code
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/yojana-sahay-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/yojana-sahay-$VERSION_NAME.aab"
          ls -la "$RUNNER_TEMP/out"

      - name: Check the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK=$(ls "$RUNNER_TEMP"/out/*.apk)
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|targetSdkVersion|sdkVersion|application-label:" | tee "$RUNNER_TEMP/badging.txt"
          # the app's own files are inside the APK, and the Android integrations are wired
          unzip -l "$APK" | grep -q "assets/public/index.html" || { echo "::error::app files missing from APK"; exit 1; }
          PJ=$(unzip -p "$APK" assets/capacitor.plugins.json)
          for c in App Share Browser SplashScreen StatusBar Filesystem TextToSpeech SpeechRecognition FirebaseAuthentication; do
            echo "$PJ" | grep -qE "\\.${c}(Plugin)?\"" || { echo "::error title=Plugin missing in APK::$c"; echo "$PJ"; exit 1; }
          done
          M=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK")
          echo "$M" | grep -q "android.intent.action.SEND" || { echo "::error::share-to-app missing"; exit 1; }
          echo "$M" | grep -q '"yojanasahay"' || { echo "::error::shortcut links missing"; exit 1; }
          echo "$M" | grep -q "android.app.shortcuts" || { echo "::error::shortcuts missing"; exit 1; }
          "$BT/aapt2" dump resources "$APK" | grep -q "ic_launcher_monochrome" || { echo "::error::Yojana Sahay app icon missing (placeholder icon would show)"; exit 1; }
          echo "$M" | grep -q "android.permission.RECORD_AUDIO" || { echo "::error::microphone permission missing (voice input)"; exit 1; }
          echo "$M" | grep -q "android.intent.action.TTS_SERVICE" || echo "::warning::text-to-speech query missing (read-aloud may be silent on Android 11+)"
          echo "::notice title=Checks::app files inside APK ✓ · share-to-app ✓ · Android bridge ✓ · shortcuts ✓ · mic ✓ · app icon ✓ · 9 Android plugins ✓ · $(unzip -l "$APK" | tail -n 1 | awk '{print int($1/1048576)" MB uncompressed"}')"
          SHA1=$(keytool -list -v -keystore "$YS_KEYSTORE" -storetype pkcs12 -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep -m1 "SHA1:" | sed 's/.*SHA1: //')
          SHA256=$(keytool -list -v -keystore "$YS_KEYSTORE" -storetype pkcs12 -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          echo "::notice title=Add to Firebase (Android app → SHA certificate fingerprints)::SHA-1 $SHA1 · SHA-256 $SHA256"
          echo "::notice title=Built::$(cat "$RUNNER_TEMP/badging.txt" | tr '\n' ' ')"

      - name: Enable the emulator (test build)
        if: env.YS_DIAG == '1'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null && true
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/scripts/android-native/diagnose.mjs" "$RUNNER_TEMP/pw/diagnose.mjs"

      - name: Run the app on an Android emulator (test build)
        if: env.YS_DIAG == '1'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-native/diagnose.sh "${{ runner.temp }}/out"

      - name: Report what happened inside the app (test build)
        if: always() && env.YS_DIAG == '1'
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), dir = process.env.RUNNER_TEMP + "/diag";
            const esc = s => s.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            for (const f of ["app.txt", "screen.txt", "logcat.txt", "pid.txt", "install.txt"]) {
              let t = ""; try { t = fs.readFileSync(path.join(dir, f), "utf8"); } catch { t = "(missing)"; }
              for (let i = 0, n = 0; i < t.length && n < 6; i += 3500, n++) console.log(`::notice title=diag ${f} ${n + 1}::${esc(t.slice(i, i + 3500))}`);
            }'

      - name: Report errors (readable from the run's annotations)
        if: failure()
        run: |
          for f in npm.log vite.log cap.log gradle.log; do
            p="$RUNNER_TEMP/$f"
            [ -f "$p" ] || continue
            node -e '
              const fs = require("fs");
              const lines = fs.readFileSync(process.argv[1], "utf8").split("\n").filter(l => l.trim() && !/^\s+at /.test(l));
              const w = lines.findIndex(l => /What went wrong|FAILURE:|ERROR|error:|Error:/.test(l));
              const tail = (w >= 0 ? lines.slice(Math.max(0, w - 5), w + 40) : lines.slice(-45)).join("\n");
              const esc = s => s.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
              console.log(`::error title=${process.argv[2]}::${esc(tail)}`);
            ' "$p" "$f"
          done

      - name: Upload the app files
        uses: actions/upload-artifact@v4
        with:
          name: yojana-sahay-native-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/out/*
          retention-days: 90
