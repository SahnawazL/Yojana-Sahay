name: Android app (Play Store)

# Builds the Yojana Sahay Android app (a Trusted Web Activity — the real
# website running full-screen inside Chrome, no browser bar) as:
#   • app-release-bundle.aab  → upload this to Google Play Console
#   • app-release-signed.apk  → install directly on a phone to test
# Download both from this run's "Artifacts" section.
#
# Signing: the upload key is re-created on every run from one GitHub secret
# (ANDROID_KEY_SEED, or CRON_SECRET if that isn't set) by
# scripts/android/make-upload-key.mjs — no key file is stored anywhere.
# The workflow also keeps public/.well-known/assetlinks.json in sync with the
# key's public fingerprint, so the app opens full-screen without a URL bar.
#
# Run it: GitHub → Actions → "Android app (Play Store)" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown on Play (e.g. 1.0.1). Leave empty for 1.0.<run>"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tools
        run: |
          npm install -g @bubblewrap/cli@1 > "$RUNNER_TEMP/npm.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/npm.log"; exit 1; }
          cd scripts/android && npm install --no-save --no-package-lock node-forge@1.3.1 > "$RUNNER_TEMP/npm2.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/npm2.log"; exit 1; }
          bubblewrap --version || true

      - name: Re-create the upload key (never stored)
        id: key
        env:
          SEED: ${{ secrets.ANDROID_KEY_SEED || secrets.CRON_SECRET }}
        run: |
          mkdir -p "$RUNNER_TEMP/twa"
          node scripts/android/make-upload-key.mjs "$RUNNER_TEMP/twa"

      - name: Prepare Android project settings
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 0 ))
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.${{ github.run_number }}"; fi
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("scripts/android/twa-manifest.json", "utf8"));
            m.appVersionCode = Number(process.argv[1]);
            m.appVersionName = process.argv[2];
            m.appVersion = process.argv[2];
            fs.writeFileSync(process.argv[3] + "/twa-manifest.json", JSON.stringify(m, null, 2));
          ' "$VERSION_CODE" "$VERSION_NAME" "$RUNNER_TEMP/twa"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          echo "::notice title=Version::$VERSION_NAME (code $VERSION_CODE)"
          echo "::notice title=Upload key SHA-256::${{ steps.key.outputs.fingerprint }}"

      - name: Generate Android project
        working-directory: ${{ runner.temp }}/twa
        run: |
          set -o pipefail
          yes | bubblewrap update --skipVersionUpgrade 2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: Build and sign (AAB + APK)
        working-directory: ${{ runner.temp }}/twa
        run: |
          set -o pipefail
          yes | bubblewrap build --skipPwaValidation 2>&1 | tee "$RUNNER_TEMP/build.log"
          ls -la *.aab *.apk

      - name: Report errors (readable from the run's annotations)
        if: failure()
        run: |
          for f in npm.log npm2.log update.log build.log; do
            p="$RUNNER_TEMP/$f"
            [ -f "$p" ] || continue
            node -e '
              const fs = require("fs");
              const tail = fs.readFileSync(process.argv[1], "utf8").split("\n").filter(l => l.trim()).slice(-45).join("\n");
              const esc = s => s.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
              console.log(`::error title=${process.argv[2]}::${esc(tail)}`);
            ' "$p" "$f"
          done

      - name: Upload the app files
        uses: actions/upload-artifact@v4
        with:
          name: yojana-sahay-android-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/twa/app-release-bundle.aab
            ${{ runner.temp }}/twa/app-release-signed.apk
          retention-days: 90

      # assetlinks.json = this upload key + any Google Play App Signing
      # fingerprints listed in scripts/android/play-signing-fingerprints.txt
      # (public values from Play Console → Setup → App signing).
      - name: Keep assetlinks.json in sync
        env:
          FP: ${{ steps.key.outputs.fingerprint }}
        run: |
          f=scripts/android/play-signing-fingerprints.txt
          PLAY_FP=""
          if [ -f "$f" ]; then PLAY_FP=$(grep -v '^#' "$f" | tr -d ' \r' | grep -E '^([0-9A-F]{2}:){31}[0-9A-F]{2}$' | paste -sd, - || true); fi
          export PLAY_FP
          node -e '
            const fs = require("fs");
            const p = "public/.well-known/assetlinks.json";
            const cur = fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "";
            const fps = [...new Set([process.env.FP, ...(process.env.PLAY_FP || "").split(",")].map(s => s.trim()).filter(Boolean))];
            const next = JSON.stringify([{ relation: ["delegate_permission/common.handle_all_urls"],
              target: { namespace: "android_app", package_name: "com.yojanasahay.app", sha256_cert_fingerprints: fps } }], null, 2) + "\n";
            if (cur === next) { console.log("assetlinks.json already up to date"); process.exit(0); }
            fs.writeFileSync(p, next);
            console.log("assetlinks.json updated:", fps.join(", "));
          '
          if ! git diff --quiet -- public/.well-known/assetlinks.json; then
            git config user.name "yojana-sahay-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/.well-known/assetlinks.json
            git commit -m "android: assetlinks.json → current signing fingerprints"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
