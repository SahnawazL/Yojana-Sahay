  <!-- ─── HTML Splash Screen — Critical CSS (shows BEFORE React loads) ──── -->
  <style>
    html, body { margin: 0; padding: 0; }
    /* Body bg matches splash so there's zero white flash even before #html-splash paints */
    body { background: #001659; }

    #html-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(160deg, #001659 0%, #003580 45%, #06038D 100%);
    }

    /* ── Keyframes ─────────────────────────────────────────────────────── */
    @keyframes hs-chakra {
      from { transform: translate(-50%,-50%) rotate(0deg); }
      to   { transform: translate(-50%,-50%) rotate(360deg); }
    }
    @keyframes hs-logo-in {
      0%   { transform: scale(0);    opacity: 0; }
      60%  { transform: scale(1.1);  opacity: 1; }
      80%  { transform: scale(0.95);             }
      100% { transform: scale(1);    opacity: 1; }
    }
    @keyframes hs-logo-pulse {
      0%,100% { transform: scale(1);    }
      50%     { transform: scale(1.05); }
    }
    @keyframes hs-ring-pulse {
      0%   { opacity: 0.7; transform: scale(1);    }
      50%  { opacity: 0;   transform: scale(1.28); }
      100% { opacity: 0.7; transform: scale(1);    }
    }
    @keyframes hs-title-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    @keyframes hs-tagline-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes hs-bar-in {
      from { transform: scaleX(0); opacity: 0; }
      to   { transform: scaleX(1); opacity: 1; }
    }
    @keyframes hs-dots-in {
      from { opacity: 0;    }
      to   { opacity: 0.55; }
    }
    /* Four drift variants for particles (avoids needing CSS custom props) */
    @keyframes hs-pA {
      0%   { transform: translateY(0)      translateX(0);    opacity: 0;   }
      10%  { opacity: 0.65; }
      90%  { opacity: 0.30; }
      100% { transform: translateY(-110vh) translateX(25px); opacity: 0;   }
    }
    @keyframes hs-pB {
      0%   { transform: translateY(0)      translateX(0);     opacity: 0;   }
      10%  { opacity: 0.50; }
      90%  { opacity: 0.20; }
      100% { transform: translateY(-110vh) translateX(-20px); opacity: 0;   }
    }
    @keyframes hs-pC {
      0%   { transform: translateY(0)      translateX(0);    opacity: 0;   }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.25; }
      100% { transform: translateY(-110vh) translateX(15px); opacity: 0;   }
    }
    @keyframes hs-pD {
      0%   { transform: translateY(0)      translateX(0);     opacity: 0;   }
      10%  { opacity: 0.40; }
      90%  { opacity: 0.18; }
      100% { transform: translateY(-110vh) translateX(-30px); opacity: 0;   }
    }

    /* ── Elements ──────────────────────────────────────────────────────── */
    .hs-particle {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      bottom: -4px;
      opacity: 0;
    }

    .hs-chakra-wrap {
      position: absolute;
      top: 50%; left: 50%;
      opacity: 0.045;
      animation: hs-chakra 16s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    .hs-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hs-logo-wrap {
      position: relative;
      margin-bottom: 24px;
    }

    .hs-ring {
      position: absolute;
      inset: -12px;
      border-radius: 44px;
      border: 2px solid #FF9933;
      opacity: 0.7;
      animation: hs-ring-pulse 2.2s ease-in-out 2.4s infinite;
    }

    .hs-logo-box {
      width: 130px; height: 130px;
      border-radius: 30px;
      overflow: hidden;
      box-shadow:
        0 0 0 3px rgba(255,153,51,0.40),
        0 0 35px rgba(255,153,51,0.55),
        0 0 70px rgba(6,3,141,0.40);
      animation:
        hs-logo-in   0.7s cubic-bezier(0.34,1.56,0.64,1) 0.05s both,
        hs-logo-pulse 2.2s ease-in-out 2.4s infinite;
    }

    .hs-logo-box img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .hs-title {
      font-size: 33px;
      font-weight: 900;
      color: #FFFFFF;
      font-family: 'Noto Sans', system-ui, sans-serif;
      letter-spacing: 0.5px;
      line-height: 1;
      text-shadow: 0 2px 24px rgba(255,153,51,0.55);
      margin-bottom: 8px;
      opacity: 0;
      animation: hs-title-in 0.5s ease 0.9s forwards;
    }

    .hs-tagline {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.72);
      font-family: 'Noto Sans', system-ui, sans-serif;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(10px);
      animation: hs-tagline-in 0.7s ease 1.75s forwards;
    }

    .hs-bar {
      display: flex;
      width: 160px; height: 3px;
      border-radius: 3px;
      overflow: hidden;
      transform: scaleX(0);
      transform-origin: left center;
      opacity: 0;
      animation: hs-bar-in 0.6s cubic-bezier(0.22,1,0.36,1) 2.1s forwards;
    }

    .hs-bar span { flex: 1; }

    .hs-dots {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 2;
      opacity: 0;
      animation: hs-dots-in 1s ease 2.4s forwards;
    }

    .hs-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }
  </style>
  </head>

        <div class="hs-tagline">Official Scheme Finder</div>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("/sw.js", { scope: "/" })
            .then(function(r) { console.log("SW registered:", r.scope); })
            .catch(function(e) { console.warn("SW failed:", e); });
        });
